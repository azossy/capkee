<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Capkee">
  <!-- White mark on black. A tile rather than a bare mark, because a tab strip
       is whatever colour the browser chrome is and a bare white mark vanishes
       on a light one. -->
