  <g fill="#ffffff" transform="translate(9 24.3) scale(1.5333)"><rect x="0" y="0" width="11.8" height="10" rx="3.25"/><rect x="18.2" y="0" width="11.8" height="10" rx="3.25"/><rect x="12.2" y="3.1" width="5.6" height="3.8" rx="1.9"/></g>
</svg>
